[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-moe"
version = "0.1.0"
description = "Julia-1 sparse MoE for typed decisions"
requires-python = ">=3.11"
dependencies = ["torch>=2.6", "transformers==5.17.0", "safetensors>=0.5", "huggingface-hub>=1.0", "requests>=2.32"]

[tool.setuptools.packages.find]
where = ["src"]
